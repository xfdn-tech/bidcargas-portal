# BidCargas portal — build e push para GitHub Container Registry (GHCR)
# Deploy Swarm via SSH desabilitado temporariamente (infra ainda não montada)
# Secrets deploy (quando reativar): VPS_HOST, VPS_USER, VPS_SSH_KEY

name: Build and push Docker image

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  APP_VERSION: 0.0.6
  DOCKER_SWARM_SERVICE: ${{ vars.DOCKER_SWARM_SERVICE || 'bidcargas_portal' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=raw,value=${{ env.APP_VERSION }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_ACCOUNT_BASE_DOMAIN=${{ vars.NEXT_PUBLIC_ACCOUNT_BASE_DOMAIN || 'bidcargas.com' }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || '/api' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Imagem publicada
        run: |
          echo "Versao: ${{ env.APP_VERSION }}"
          echo "Imagem principal: ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}"
          echo "Imagem latest: ${{ env.IMAGE_NAME }}:latest"
          echo "Todas as tags publicadas:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "## Imagem Docker publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Versao:** \`${{ env.APP_VERSION }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Imagem:** \`${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Latest:** \`${{ env.IMAGE_NAME }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tags:**" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Deploy via SSH — desabilitado temporariamente (infra Swarm ainda não montada)
      # - name: Deploy via SSH
      #   id: deploy
      #   uses: appleboy/ssh-action@v1.2.2
      #   with:
      #     host: ${{ secrets.VPS_HOST }}
      #     username: ${{ secrets.VPS_USER }}
      #     key: ${{ secrets.VPS_SSH_KEY }}
      #     port: ${{ vars.VPS_SSH_PORT || '22' }}
      #     timeout: 90s
      #     command_timeout: 15m
      #     script_stop: true
      #     script: |
      #       docker service update \
      #         --with-registry-auth \
      #         --image ${{ env.IMAGE_NAME }}:latest \
      #         ${{ env.DOCKER_SWARM_SERVICE }}

  notify:
    needs: build-and-push
    if: always() && needs.build-and-push.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Notify workflow result
        continue-on-error: true
        env:
          NOTIFY_URL: ${{ secrets.N8N_BUILD_NOTIFY_URL }}
          JOB_RESULT: ${{ needs.build-and-push.result }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          HTML_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_FULL: ${{ github.repository }}
          REPO_NAME: ${{ github.event.repository.name }}
          APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          case "$JOB_RESULT" in
            success) CONCLUSION=success ;;
            failure) CONCLUSION=failure ;;
            cancelled) CONCLUSION=cancelled ;;
            *) CONCLUSION=failure ;;
          esac

          URL="${NOTIFY_URL:-https://n8n.xfdn.tech/webhook/github-notify}"
          PAYLOAD=$(jq -n \
            --arg action completed \
            --argjson id "$RUN_ID" \
            --arg name "$WORKFLOW" \
            --arg branch "$REF_NAME" \
            --arg sha "$SHA" \
            --arg conclusion "$CONCLUSION" \
            --arg status completed \
            --arg html_url "$HTML_URL" \
            --arg display_title "$WORKFLOW" \
            --arg repo_full "$REPO_FULL" \
            --arg repo_name "$REPO_NAME" \
            --arg app_version "$APP_VERSION" \
            --arg job_result "$JOB_RESULT" \
            '{
              action: $action,
              conclusion: $conclusion,
              job_result: $job_result,
              app_version: $app_version,
              workflow_run: {
                id: $id,
                name: $name,
                head_branch: $branch,
                head_sha: $sha,
                conclusion: $conclusion,
                status: $status,
                html_url: $html_url,
                display_title: $display_title
              },
              repository: {
                full_name: $repo_full,
                name: $repo_name
              }
            }')

          echo "Notifying $URL (job_result=$JOB_RESULT conclusion=$CONCLUSION)"
          curl -fsS -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: workflow_run" \
            -H "X-GitHub-Delivery: $RUN_ID" \
            -d "$PAYLOAD"
